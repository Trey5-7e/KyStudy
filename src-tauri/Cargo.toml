[package]
name = "kystudy"
version = "0.1.0"
description = "Local-first study planning and mistake review desktop application"
authors = ["KyStudy contributors"]
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "kystudy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
fs4 = "1.1.0"
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["v4", "v7"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
