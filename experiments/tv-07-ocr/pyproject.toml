[project]
name = "kystudy-tv07-ocr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "onnxruntime==1.27.0",
  "pillow==12.3.0",
  "psutil==7.2.2",
  "rapidocr==3.9.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
