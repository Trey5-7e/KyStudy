name: Publish Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed Windows updater
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      KYSTUDY_OCR_DOWNLOAD_URL: https://github.com/Trey5-7e/KyStudy/releases/download/ocr-v0.1.4/kystudy-ocr-worker-v0.1.4.zip
      KYSTUDY_OCR_DOWNLOAD_SHA256: 3d339393de86f7759dc764fb844d97761e4ddf8354dd2330b71eb1a765c3fe6f

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Install locked pnpm version
        shell: pwsh
        run: |
          npm install --global pnpm@11.9.0
          pnpm --version

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          $version = $env:EXPECTED_VERSION -replace '^v', ''
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/check-release-version.ps1') -ExpectedVersion $version

      - name: Publish signed Tauri assets
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KYSTUDY_OCR_DOWNLOAD_URL: ${{ env.KYSTUDY_OCR_DOWNLOAD_URL }}
          KYSTUDY_OCR_DOWNLOAD_SHA256: ${{ env.KYSTUDY_OCR_DOWNLOAD_SHA256 }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: KyStudy ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## KyStudy v0.1.4 更新内容

            **AI 学习助手**
            - 主导航新增独立 AI 工作区：历史会话、模型切换、Markdown/LaTeX 渲染、失败重试与协作式取消
            - 原生 SSE 流式输出与思考链（CoT）隔离，移除人为 Token 截断
            - 剪贴板粘贴 / 拖拽图片的多模态发送；本地 PDF（含扫描件）解析后参与问答

            **模型与 API 管理中心**
            - Provider 卡片、连接测试、多模型与默认模型管理，主流供应商预设
            - API Key 由 Rust 凭据层隔离保存，不进入前端与日志
            - 资料能力校准（图片/文件/PDF），不支持原生传输时自动降级为本地文本索引

            **做题本 PDF 适配**
            - 内置六册 Profile：李永乐 660 高数/线概、李艳芳 900 高数/线代概率、张宇 1000 题高数/线概
            - 无标点题号、子章节、测试卷与跨页题目识别；稀疏页按需本地 OCR
            - 导入诊断卡片与 JSON 基线导出；分段回收站支持“彻底删除”与“一键清空”

            **其他**
            - 低干扰 Token 预算（默认仅警告）与临时附件生命周期管理
            - 安装版数据目录迁移至安装目录内（旧数据自动迁移）

            OCR 组件独立下载，见 [ocr-v0.1.4 Release](https://github.com/Trey5-7e/KyStudy/releases/tag/ocr-v0.1.4)；完整发布说明见仓库 `docs/V0_1_4_RELEASE_NOTES.md`。
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Package Windows portable archive
        shell: pwsh
        run: pnpm package:windows-portable

      - name: Build Windows release manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $bundleDirectory = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/bundle'
          $nsisDirectory = Join-Path $bundleDirectory 'nsis'
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $setupPath = Join-Path $nsisDirectory "KyStudy_${version}_x64-setup.exe"
          $signaturePath = "$setupPath.sig"
          $portablePath = Join-Path $artifactDirectory 'kystudy-windows-x64-portable.zip'
          $manifestPath = Join-Path $artifactDirectory 'kystudy-windows-x64-release-manifest.json'

          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "Expected NSIS asset was not produced: $setupPath"
          }
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Expected NSIS signature was not produced: $signaturePath"
          }
          if (-not (Test-Path -LiteralPath $portablePath -PathType Leaf)) {
            throw "Expected portable asset was not produced: $portablePath"
          }

          $updaterPath = Get-ChildItem -LiteralPath $bundleDirectory -Recurse -File -Filter 'latest.json' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $updaterPath) {
            gh release download $env:RELEASE_TAG --pattern 'latest.json' --dir $artifactDirectory --clobber
            $updaterPath = Join-Path $artifactDirectory 'latest.json'
          }
          if (-not (Test-Path -LiteralPath $updaterPath -PathType Leaf)) {
            throw 'Expected updater JSON was not produced or uploaded.'
          }

          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/write-windows-release-manifest.ps1') `
            -Version $version `
            -OutputPath $manifestPath `
            -ArtifactPath @($setupPath, $signaturePath, $updaterPath, $portablePath)

      - name: Upload Windows portable archive and release manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ env.RELEASE_TAG }}"
          artifacts/kystudy-windows-x64-portable.zip
          artifacts/kystudy-windows-x64-release-manifest.json
          --clobber
